# The .pyx files are the source of truth for the compiled backend, but the
# release build (setup.py) compiles the committed .c directly and never runs
# Cython — that keeps Cython and its exact, version-dependent codegen out of
# the packaging path. This gate is the other half of that deal: it fails if a
# committed .c isn't what its .pyx currently produces, so a stale .c can't
# slip through and ship code that doesn't match its source. That's the failure
# that broke v1.0.1 (a server.pyx fix whose .c wasn't regenerated shipped
# listing zero models).
#
# Edit a .pyx -> run `python scripts/regen_cython.py` (with Cython==3.3.0) ->
# commit the regenerated .c alongside it.

name: Backend check

# Must match the pin in scripts/regen_cython.py — Cython's codegen isn't
# byte-stable across versions, so the check and the committed .c have to be
# generated by the same one.
env:
  CYTHON_VERSION: '3.3.0'

on:
  pull_request:
    paths:
      - 'Multi-AI/multi_ai/**'
      - 'backend_build.py'
      - 'scripts/regen_cython.py'
      - 'setup.py'
      - '.github/workflows/backend-check.yml'
  push:
    branches: [main]
    paths:
      - 'Multi-AI/multi_ai/**'
      - 'backend_build.py'
      - 'scripts/regen_cython.py'
      - 'setup.py'
      - '.github/workflows/backend-check.yml'

jobs:
  cython-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The regenerated C is normalised to be OS- and path-independent
          # (see backend_build.py), so this need not run on Windows. Kept at
          # the release's Python minor version for parity all the same.
          python-version: '3.14'

      - name: Regenerate the committed C from the .pyx sources
        run: |
          python -m pip install "Cython==${CYTHON_VERSION}"
          python scripts/regen_cython.py

      - name: Fail if any committed .c is stale
        run: |
          if ! git diff --exit-code -- '*.c'; then
            echo "::error::A committed .c no longer matches its .pyx. Run 'python scripts/regen_cython.py' (Cython==${CYTHON_VERSION}) and commit the result."
            exit 1
          fi
