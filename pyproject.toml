# Build configuration for the compiled Python backend.
# Package metadata, extension modules, and the console entry point live in
# setup.py. It compiles the committed .c files (regenerated from the .pyx
# sources by scripts/regen_cython.py) directly, so the build needs a C
# compiler (MSVC on Windows) but NOT Cython — Cython only runs in
# scripts/regen_cython.py and the backend-check CI job, both at a pinned
# version. This keeps `pip install -e . --no-deps` working with build
# isolation.
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
